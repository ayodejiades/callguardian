# Render free web service. See references/HOSTING.md for the Hugging Face Space and Koyeb
# equivalents — the same Dockerfile runs unchanged on all three.
#
# The public reference deploy runs DEMO_MODE=1 deliberately: /api/gate/*-external has no
# auth in front of it (see plugins/google-sheets-callguardian/README.md's credential
# section), so a public instance with a real CALLE_API_KEY would let any visitor spend the
# account's real call quota on arbitrary numbers. DEMO_MODE=1 makes that a non-issue —
# every call returns a fixture, never touches CALL-E. Judges and the demo video both work
# fine from this; the real-account proof lives in AGENTS.md / docs/FAILURE_CASE.md instead.
services:
  - type: web
    name: callguardian
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
