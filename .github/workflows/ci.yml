name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        if: hashFiles('package.json') != ''
        run: corepack enable

      - name: Install (node)
        if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile

      - name: Lint (node)
        if: hashFiles('package.json') != ''
        run: pnpm lint

      - name: Build (node)
        if: hashFiles('package.json') != ''
        run: pnpm build

      - name: Test (node)
        if: hashFiles('package.json') != ''
        run: pnpm test

      - name: Set up Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: hashFiles('pyproject.toml') != ''
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install (python)
        if: hashFiles('pyproject.toml') != ''
        run: uv sync

      - name: Test (python)
        if: hashFiles('pyproject.toml') != ''
        run: uv run pytest
